name: Shim build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        # Pin third-party actions to immutable commits; update with Dependabot.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Shim and run hardware-free tests
        shell: pwsh
        run: .\BuildBridge.ps1 -Test -OutputDirectory .\artifacts\build

      - name: Verify and assemble the distributable package
        shell: pwsh
        run: .\PackageBridge.ps1 -SkipTests -OutputDirectory .\artifacts\package

      - name: Upload Shim build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Shim-${{ github.sha }}
          path: |
            artifacts/build/Shim.exe
            artifacts/build/Shim.Tests.exe
            dist/Shim-0.5.0.zip
            dist/Shim-0.5.0.zip.sha256
          if-no-files-found: error
          retention-days: 14
